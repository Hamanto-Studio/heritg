name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - "tests/compatibility/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/compatibility/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: iOS Build and Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Heritg.xcodeproj \
            -scheme HERITG \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
