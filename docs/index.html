<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HERITG | A safe home for your family history</title>
  <meta name="description" content="HERITG is an open-source, local-first family tree app with no account, no ads, and no tracking.">
  <link rel="canonical" href="https://heritg.hamanto.com/">
  <script>
    let savedLanguage = null;
    try { savedLanguage = localStorage.getItem('heritg-language'); } catch (_) {}
    const preferredLanguages = navigator.languages?.length ? navigator.languages : [navigator.language];
    const preferredLanguage = preferredLanguages.find((language) => /^(id|in|en)(-|$)/i.test(language || ''));
    const detectedLanguage = /^(id|in)(-|$)/i.test(preferredLanguage || '') ? 'id' : 'en';
    const destinationLanguage = /^(id|en)$/.test(savedLanguage || '') ? savedLanguage : detectedLanguage;
    window.location.replace(`${destinationLanguage}/${window.location.search}${window.location.hash}`);
  </script>
</head>
<body><p>Opening HERITG… <a href="en/">Continue in English</a> · <a href="id/" lang="id">Lanjut dalam Bahasa Indonesia</a> · <a href="https://heritgapp.hamanto.com/">Open the web app</a></p></body>
</html>
