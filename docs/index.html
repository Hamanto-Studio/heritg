  <script>
    let savedLanguage = null;
    try { savedLanguage = localStorage.getItem('heritg-language'); } catch (_) {}
    const preferredLanguages = navigator.languages?.length ? navigator.languages : [navigator.language];
    const preferredLanguage = preferredLanguages.find((language) => /^(id|in|en)(-|$)/i.test(language || ''));
    const detectedLanguage = /^(id|in)(-|$)/i.test(preferredLanguage || '') ? 'id' : 'en';
    const destinationLanguage = /^(id|en)$/.test(savedLanguage || '') ? savedLanguage : detectedLanguage;
    window.location.replace(`${destinationLanguage}/${window.location.search}${window.location.hash}`);
  </script>
